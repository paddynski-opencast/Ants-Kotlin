<html xmlns="http://www.w3.org/1999/html">
<head>
    <title>Ants</title>
</head>
<bodu>
    <h1>Ants</h1>
    <hr>
    <p>
    <a href="/">Reset</a>
    <hr>
    <p>Network</p>
    <pre>{network}</pre>
    <hr>
    <form action="/add" method="post">
        <Input type="text" value="{id}" style="display: none;" name="id">
        <button>Add Node</button>
    </form>
    <hr>
    <form action="/connect" method="post">
        <Input type="text" value="{id}" style="display: none;" name="id">
        <table>
            <tr>
                <td>From</td>
                <td><Input type="number" value="0" min="0" max="{max}" name="from"></td>
            </tr>
            <tr>
                <td>To</td>
                <td><Input type="number" value="0" min="0" max="{max}" name="to"></td>
            </tr>
        </table>
        <p>
        <button>Connect</button>
    </form>
    <hr>
    <form action="/test" method="post">
        <Input type="text" value="{id}" style="display: none;" name="id">
        <table>
            <tr>
                <td>From</td>
                <td><Input type="number" value="0" min="0" max="{max}" name="from"></td>
            </tr>
            <tr>
                <td>To</td>
                <td><Input type="number" value="0" min="0" max="{max}" name="to"></td>
            </tr>
        </table>
        <p>
        <button>Search</button>
    </form>
</bodu>
</html>
